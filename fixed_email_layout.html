<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixed Email Layout</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0f1720;
        font-family: Arial, Helvetica, sans-serif;
      }
      .email-shell {
        width: 100%;
        background: #0f1720;
      }
      .email-body {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        background: #1a232c;
      }
      .hero {
        border-radius: 28px 28px 0 0;
        background: linear-gradient(135deg, #8f0d00 0%, #d31313 100%);
      }
      .hero-content {
        text-align: center;
        padding: 44px 20px;
      }
      .hero-logo {
        width: 100%;
        max-width: 520px;
        height: auto;
        display: inline-block;
        vertical-align: middle;
      }
      .copy {
        color: #e8eef4;
        padding: 36px 38px 40px;
        font-size: 40px;
      }
      .copy p {
        margin: 0 0 18px;
        line-height: 1.45;
      }
      .copy .small {
        font-size: 16px;
      }

      @media only screen and (max-width: 620px) {
        .hero-content {
          padding: 26px 16px;
        }
        .copy {
          padding: 24px 20px 28px;
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <table role="presentation" class="email-shell" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table role="presentation" class="email-body" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td class="hero" valign="middle" align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td class="hero-content" valign="middle" align="center">
                      <!-- IMPORTANT: keep display:block and remove margin-top to avoid Gmail mobile misalignment -->
                      <img
                        src="https://dummyimage.com/1040x210/000/fff.png&text=The+Frontman+%7C+HR+COMMUNICATIONS"
                        alt="The Frontman | HR Communications"
                        class="hero-logo"
                        style="display: block; margin: 0 auto; border: 0; outline: none; text-decoration: none"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="copy">
                <p><strong>Good day!</strong></p>
                <p class="small">Below are the official communication channels for <strong>The Frontman</strong>.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
